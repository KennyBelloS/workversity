<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6FA8DC" />
    <meta name="description" content="Organiza tu vida entre trabajo y universidad." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Workversity" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Workversity</title>
    <script>
      try {
        var p = localStorage.getItem('workversity:tema') || 'sistema';
        var d = p === 'oscuro' || (p === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
        var t = localStorage.getItem('workversity:texto');
        if (t === 'grande') document.documentElement.style.fontSize = '18px';
        else if (t === 'enorme') document.documentElement.style.fontSize = '20px';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Workversity necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
